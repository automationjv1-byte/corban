<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitio con conexión simulada</title>
<!-- Solo para pruebas: carga el sitio real (sitio/) con una conexión simulada que controla prueba-sitio.html. -->
<base href="../sitio/">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<script>
(async () => {
  // prueba-sitio.html controla esta página. Abierta sola, usa un catálogo de ejemplo con secciones.
  const control = window.parent !== window ? window.parent : {
    __CATALOGO: {
      ok: true, actualizado: new Date().toISOString(),
      negocio: { nombre_negocio: 'Ejemplo', whatsapp: '5491100000000', mail_pedidos: 'prueba@ejemplo.com', texto_aviso: 'Envíos a todo el país | 3 cuotas sin interés', formas_de_pago: 'Efectivo', mostrar_precios: true, mayoristas: true },
      categorias: ['Termofusión', 'Válvulas', 'Codos', 'Herramientas'], financiacion: [{ cuotas: 3, recargo: 0 }],
      arbol: [{ nombre: 'Termofusión', hijas: ['Válvulas', 'Codos'] }, { nombre: 'Herramientas', hijas: [] }],
      paginas: [
        { clave: 'quienes-somos', menu: 'Quiénes somos', titulo: 'Quiénes somos', texto: 'Párrafo de ejemplo.\n\nOtro párrafo con un enlace: https://ejemplo.com\n\n- Punto uno\n- Punto dos' },
        { clave: 'envios-y-pagos', menu: 'Envíos y pagos', titulo: 'Envíos y pagos', texto: '## Envíos\nTexto de envíos.\n\n## Pagos\nTexto de pagos.' },
        { clave: 'preguntas-frecuentes', menu: 'Preguntas frecuentes', titulo: 'Preguntas frecuentes', texto: '## ¿Cómo hago un pedido?\nArmá tu pedido y envialo.\n\n## ¿Hacen envíos?\nSí.' },
        { clave: 'contacto', menu: 'Contacto', titulo: 'Contacto', texto: 'Lunes a viernes de 9 a 18.' },
      ],
      productos: ['E1', 'E2', 'E3'].map((c, i) => ({ codigo: c, nombre: 'Producto ' + c, categoria: ['Codos', 'Herramientas', 'Termofusión'][i], descripcion: 'Ejemplo', foto: '', alt: 'Ejemplo', destacado: false, estado: 'disponible', precio: 10000 * (i + 1), cuotas: [], escalas: i ? undefined : [{ desde: 6, descuento: 0.05 }] }))
        .concat([['V1', 'grande', 'gris', 'para llevar', 25000], ['V2', 'mediano', 'blanco', 'para retirar', 30000], ['V3', 'chico', 'azul', 'para enviar', 48000], ['V4', 'chico', 'gris', 'para llevar', 46000, 'sin_stock']].map(([c, tam, color, entrega, precio, est]) => ({
          codigo: c, nombre: `Válvula de drenaje (${tam} · ${color} · ${entrega})`, grupo: 'Válvula de drenaje', categoria: 'Válvulas',
          descripcion: 'Ejemplo de producto con opciones.', foto: '', alt: 'Válvula', destacado: false, estado: est || 'disponible', precio, cuotas: [],
          // Como llega del script cuando las características se cargan sin "Nombre:" (salvo Color en una fila)
          opciones: [{ nombre: 'Opción 1', valor: tam }, { nombre: 'Color', valor: color }, { nombre: 'Opción 3', valor: entrega }],
        }))),
    },
    // Para ver el modo mayorista: abrir sitio-falso.html?acceso=tokenbueno0123456789abcdef0123456789
    __MAYORISTA: { escalas: { E1: [{ desde: 6, descuento: 0.15 }, { desde: 24, descuento: 0.25 }], E2: [{ desde: 10, descuento: 0.2 }] }, monto_minimo: 100000, unidades_minimas: 6 },
  };
  const fetchReal = window.fetch.bind(window);
  // No dejar el catálogo de prueba guardado: el sitio real lo mostraría al abrirse en esta compu.
  window.addEventListener('pagehide', () => localStorage.removeItem('catalogo_cache_v1'));
  window.__posts = [];
  window.__beacons = [];
  window.__avisos = [];
  const avisoOriginal = console.warn;
  console.warn = (...a) => { window.__avisos.push(a.join(' ')); avisoOriginal.apply(console, a); };
  navigator.sendBeacon = (url, cuerpo) => { window.__beacons.push({ url, cuerpo }); return true; };
  window.fetch = async (url, opciones) => {
    if (opciones && opciones.method === 'POST') {
      window.__posts.push({ url, opciones });
      if (control.__modoPost === 'falla') throw new TypeError('Failed to fetch');
      const cuerpo = JSON.parse(opciones.body);
      // Respuestas del script para mayoristas (simuladas)
      const may = control.__MAYORISTA || {};
      let respuesta = { ok: true, pedido: 42 };
      if (cuerpo.tipo === 'mayorista_acceso') respuesta = { ok: true };
      if (cuerpo.tipo === 'mayorista_validar') respuesta = cuerpo.token === 'tokenbueno0123456789abcdef0123456789'
        ? { ok: true, sesion: 'SESION-OK', nombre: 'Mayo Rista' } : { ok: false, error: 'El enlace venció o ya se usó. Pedí uno nuevo.' };
      if (cuerpo.tipo === 'mayorista_datos') respuesta = cuerpo.sesion === 'SESION-OK' && !may.bloqueado
        ? { ok: true, nombre: 'Mayo Rista', escalas: may.escalas || {}, monto_minimo: may.monto_minimo || 0, unidades_minimas: may.unidades_minimas || 0 }
        : { ok: false, sesion_invalida: true };
      return { ok: true, json: async () => respuesta };
    }
    await new Promise(r => setTimeout(r, 300));
    return { ok: true, json: async () => JSON.parse(JSON.stringify(control.__CATALOGO)) };
  };

  // Copia el contenido de sitio/index.html y carga sus scripts, en el mismo orden.
  const html = await (await fetchReal('index.html', { cache: 'no-store' })).text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  [...doc.body.childNodes].forEach(n => document.body.appendChild(document.importNode(n, true)));
  for (const src of ['config.js', 'app.js']) {
    await new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = src + '?v=' + Date.now();
      s.onload = ok; s.onerror = mal;
      document.head.appendChild(s);
    });
  }
  window.__listo = true;
})();
</script>
</body>
</html>
