<script>
// ---------------------------------------------------------------
// Simulación mínima de los servicios de Google
// ---------------------------------------------------------------
const encadenable = () => new Proxy(function () {}, { get: (t, p) => p === 'then' ? undefined : encadenable(), apply: () => encadenable() });

function a1(ref) {
  const m = ref.match(/^([A-Z]+)(\d*)(?::([A-Z]+)(\d*))?$/);
  const col = s => s.split('').reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0);
  const r1 = Number(m[2] || 1), c1 = col(m[1]);
  if (!m[3]) return [r1, c1, 1, 1];
  const r2 = m[4] ? Number(m[4]) : 1000, c2 = col(m[3]);
  return [r1, c1, r2 - r1 + 1, c2 - c1 + 1];
}

class Hoja {
  constructor(nombre) { this.nombre = nombre; this.datos = []; this.formulas = {}; this.fallarAlAgregar = false; }
  getName() { return this.nombre; }
  getLastRow() { return this.datos.length; }
  getLastColumn() { return Math.max(0, ...this.datos.map(f => f.length)); }
  celda(r, c) { return (this.datos[r - 1] || [])[c - 1] ?? ''; }
  poner(r, c, v) { while (this.datos.length < r) this.datos.push([]); const f = this.datos[r - 1]; while (f.length < c) f.push(''); f[c - 1] = v; }
  getRange(a, b, c, d) {
    const [r, col, nr, nc] = typeof a === 'string' ? a1(a) : [a, b, c || 1, d || 1];
    return rango(this, r, col, nr, nc);
  }
  getDataRange() { return rango(this, 1, 1, Math.max(1, this.getLastRow()), Math.max(1, this.getLastColumn())); }
  setFrozenRows() {} setRowHeight() {} setColumnWidth() {} setConditionalFormatRules() {} setTabColor() {}
  newChart() { return encadenable(); } insertChart() { this.graficos = (this.graficos || 0) + 1; }
  deleteRow(n) { this.datos.splice(n - 1, 1); }
  insertRowAfter(n) { this.datos.splice(n, 0, []); }
  clear() { this.datos = []; } clearNotes() {}
  protect() { return encadenable(); }
  appendRow(fila) { if (this.fallarAlAgregar) throw new Error('planilla caída (simulado)'); this.datos.push(fila.slice()); }
}
function rango(h, r, c, nr, nc) {
  const base = {
    getSheet: () => h, getRow: () => r, getColumn: () => c, getNumRows: () => nr, getNumColumns: () => nc,
    getValues: () => Array.from({ length: nr }, (_, i) => Array.from({ length: nc }, (_, j) => h.celda(r + i, c + j))),
    getValue: () => h.celda(r, c),
    getDisplayValue: () => String(h.celda(r, c)),
    setValues: v => { v.forEach((f, i) => f.forEach((x, j) => h.poner(r + i, c + j, x))); return prox; },
    setValue: v => { h.poner(r, c, v); return prox; },
    setFormula: f => { h.formulas[`${r},${c}`] = f; return prox; },
    clearContent: () => { h.poner(r, c, ''); return prox; },
    setDataValidation: v => { (h.validaciones = h.validaciones || {})[c] = v; return prox; },
  };
  const prox = new Proxy(base, { get: (t, p) => p in t ? t[p] : () => prox });
  return prox;
}
const hojas = new Map();
const libro = {
  getSheetByName: n => hojas.get(n) || null,
  insertSheet: n => { const h = new Hoja(n); hojas.set(n, h); return h; },
  getSheets: () => [...hojas.values()],
  deleteSheet: h => hojas.delete(h.nombre),
  setActiveSheet: () => {}, toast: (m, t) => { libro.ultimoToast = (t || '') + ': ' + m; },
};
const SpreadsheetApp = {
  getActiveSpreadsheet: () => libro,
  // Anota lo que se pidió (requireValueInList, etc.) para poder revisarlo después.
  newDataValidation: () => { const regla = {}; const b = new Proxy(regla, { get: (t, k) => (k === 'build' ? () => t : (...a) => { t[k] = a; return b; }) }); return b; },
  newConditionalFormatRule: encadenable, getUi: encadenable,
  flush: () => {},
};
const Charts = { ChartType: { COLUMN: 'COLUMN', BAR: 'BAR' } };
const memoria = new Map();
const CacheService = { getScriptCache: () => ({
  get: k => memoria.get(k) ?? null,
  put: (k, v) => memoria.set(k, v),
  getAll: ks => Object.fromEntries(ks.filter(k => memoria.has(k)).map(k => [k, memoria.get(k)])),
  putAll: o => Object.entries(o).forEach(([k, v]) => { if (v.length > 100000) throw new Error('muy grande'); memoria.set(k, v); }),
  remove: k => memoria.delete(k),
}) };
const enviados = [];
const MailApp = {
  fallar: false,
  sendEmail: (o, asunto, cuerpo) => { if (MailApp.fallar) throw new Error('Service invoked too many times for one day: email.'); enviados.push(typeof o === 'string' ? { to: o, subject: asunto, body: cuerpo } : o); orden.push('mail'); },
  getRemainingDailyQuota: () => 100 - enviados.length,
};
const orden = [];
const props = {};
const PropertiesService = { getScriptProperties: () => ({ getProperty: k => props[k] ?? null, setProperty: (k, v) => { props[k] = v; } }) };
const LockService = { getScriptLock: () => ({ waitLock() {}, releaseLock() {} }) };
const ContentService = { MimeType: { JSON: 'json' }, createTextOutput: s => ({ texto: s, setMimeType() { return this; } }) };
// Resumen NO criptográfico: alcanza para simular firmas (cambia si cambia cualquier letra).
function hashFalso(s) {
  const out = []; let h = 2166136261;
  for (let r = 0; r < 32; r++) { for (const c of s + r) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } out.push(((h >>> 0) & 255) - 128); }
  return out;
}
const Utilities = {
  formatDate: d => d.toISOString().slice(0, 16),
  Charset: { UTF_8: 'UTF-8' },
  DigestAlgorithm: { SHA_256: 'SHA_256' },
  getUuid: () => crypto.randomUUID(),
  base64EncodeWebSafe: v => {
    const bytes = typeof v === 'string' ? new TextEncoder().encode(v) : Uint8Array.from(v.map(b => b & 255));
    let s = ''; bytes.forEach(b => { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_');
  },
  base64DecodeWebSafe: t => Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)),
  newBlob: bytes => ({ getDataAsString: () => new TextDecoder().decode(Uint8Array.from(bytes.map(b => b & 255))) }),
  computeHmacSha256Signature: (texto, clave) => hashFalso(clave + '::' + texto),
  computeDigest: (alg, texto) => hashFalso(String(texto)),
};
const Session = { getScriptTimeZone: () => 'America/Argentina/Buenos_Aires' };

// ---------------------------------------------------------------
// Pruebas
// ---------------------------------------------------------------
const lista = document.getElementById('resultados');
let fallas = 0;
function chequear(nombre, condicion, detalle) {
  const li = document.createElement('li');
  li.className = condicion ? 'ok' : 'mal';
  li.textContent = (condicion ? '✔ ' : '✘ ') + nombre + (condicion || !detalle ? '' : ' — ' + detalle);
  lista.appendChild(li);
  if (!condicion) fallas++;
}
const respuesta = salida => JSON.parse(salida.texto);
const post = obj => respuesta(doPost({ postData: { contents: JSON.stringify(obj) } }));
const editar = (hoja, fila, col, valor) => { hojas.get(hoja).poner(fila, col, valor); onEdit({ source: libro, value: valor, range: hojas.get(hoja).getRange(fila, col) }); };
const fila = (hoja, codigo) => hojas.get(hoja).datos.findIndex(f => f[0] === codigo) + 1;
const columnaProductos = titulo => hojas.get('Productos').datos[0].indexOf(titulo) + 1;

async function correr() {
  const codigo = await (await fetch('../apps-script/Codigo.gs', { cache: 'no-store' })).text();
  const s = document.createElement('script');
  s.textContent = codigo;
  document.body.appendChild(s);

  // 1. Armado de la planilla
  libro.insertSheet('Hoja 1');
  configurarPlanilla();
  chequear('configurarPlanilla crea las 10 hojas y saca "Hoja 1"',
    ['Productos', 'Categorías', 'Financiación', 'Cuotas (calculado)', 'Pedidos', 'Configuración', 'Páginas', 'Escalas', 'Mayoristas', 'Reportes'].every(n => hojas.has(n)) && !hojas.has('Hoja 1'));
  const rep = hojas.get('Reportes');
  chequear('Reportes: arma el resumen, las tablas, los nombres y 2 gráficos',
    ['5,2', '6,2', '7,2', '11,2', '5,4', '5,8', '5,12', '5,16', '15,1', '16,3', '15,5', '16,7'].every(k => rep.formulas[k]) && rep.graficos === 2,
    Object.keys(rep.formulas).join(' '));
  chequear('Reportes: cuenta como venta solo Confirmado o Entregado, y busca las columnas por título',
    /SUMIFS\(c\("Total contado"\),c\("Estado"\),"Confirmado"\)\+SUMIFS\(c\("Total contado"\),c\("Estado"\),"Entregado"\)/.test(rep.formulas['5,2']) &&
    /XMATCH\(n,h\)/.test(rep.formulas['5,4']) && /\^\(Confirmado\|Entregado\)\$/.test(rep.formulas['5,4']));
  const antes = JSON.stringify(hojas.get('Productos').datos);
  configurarPlanilla();
  chequear('correrlo dos veces no pisa nada', JSON.stringify(hojas.get('Productos').datos) === antes && /No hice cambios/.test(libro.ultimoToast));
  chequear('Categorías viene en dos columnas: Categoría | Subcategoría', JSON.stringify(hojas.get('Categorías').datos[0]) === '["Categoría","Subcategoría"]', JSON.stringify(hojas.get('Categorías').datos[0]));
  hojas.get('Categorías').datos.push(['Categoría A', 'Subcategoría A1']);

  // La hoja calculada la llenan fórmulas de Google; acá se simula su resultado.
  const cuotas = hojas.get('Cuotas (calculado)');
  cuotas.datos = [['Código', 3, 6]];
  hojas.get('Productos').datos.slice(1).forEach(f => cuotas.datos.push([f[0], +(f[4] / 3).toFixed(2), +(f[4] * 1.15 / 6).toFixed(2)]));

  // 2. Prueba de vida
  const vida = respuesta(doGet({ parameter: {} }));
  chequear('prueba de vida responde {"ok":true,"productos":9}', vida.ok === true && vida.productos === 9, JSON.stringify(vida));

  // 3. Catálogo
  const cat = respuesta(doGet({ parameter: { accion: 'catalogo' } }));
  const textoCat = JSON.stringify(cat);
  document.getElementById('muestra').textContent = JSON.stringify(cat, null, 2);
  chequear('el inactivo (P006) no sale', !cat.productos.some(p => p.codigo === 'P006'));
  chequear('no salen columnas privadas (costo, proveedor, notas)',
    !/Proveedor|15000|Activo = no|costo|notas/i.test(JSON.stringify(cat.productos)) && cat.productos.every(p => !('costo' in p) && !('proveedor' in p)));
  chequear('no sale el número de stock (mostrar_stock_exacto = no)', cat.productos.every(p => !('cantidad' in p) && !('stock' in p)));
  const est = Object.fromEntries(cat.productos.map(p => [p.codigo, p.estado]));
  chequear('estados: P001 disponible, P002 últimas, P003 sin stock', est.P001 === 'disponible' && est.P002 === 'ultimas' && est.P003 === 'sin_stock', JSON.stringify(est));
  chequear('categorías en el orden de la hoja', JSON.stringify(cat.categorias) === '["Categoría A","Categoría B","Categoría C"]', JSON.stringify(cat.categorias));
  chequear('árbol: una subcategoría sin productos no aparece (Subcategoría A1)', JSON.stringify(cat.arbol.map(n => [n.nombre, n.hijas])) === '[["Categoría A",[]],["Categoría B",[]],["Categoría C",[]]]', JSON.stringify(cat.arbol));
  const colCatP = hojas.get('Productos').datos[0].indexOf('Categoría') + 1;
  editar('Productos', fila('Productos', 'P002'), colCatP, 'Subcategoría A1');
  const catSub = respuesta(doGet({ parameter: { accion: 'catalogo' } }));
  chequear('árbol: con un producto en "Subcategoría A1", aparece dentro de "Categoría A" (y en la lista, justo después)',
    JSON.stringify(catSub.arbol[0]) === '{"nombre":"Categoría A","hijas":["Subcategoría A1"]}' && catSub.categorias.join('|') === 'Categoría A|Subcategoría A1|Categoría B|Categoría C', JSON.stringify(catSub.arbol) + ' ' + catSub.categorias.join('|'));
  const catH = hojas.get('Categorías');
  catH.datos.push(['Categoría C', 'Sub de C']);
  editar('Productos', fila('Productos', 'P003'), colCatP, 'Sub de C');
  chequear('árbol: una categoría grande sin productos propios igual aparece si su subcategoría tiene',
    respuesta(doGet({ parameter: { accion: 'catalogo' } })).arbol.some(n => n.nombre === 'Categoría C' && n.hijas[0] === 'Sub de C'));
  editar('Productos', fila('Productos', 'P002'), colCatP, 'Categoría A');
  editar('Productos', fila('Productos', 'P003'), colCatP, 'Categoría B');
  catH.datos.pop();

  // Categorías en el formato viejo (Nombre | Orden | Dentro de), con los datos reales de la planilla de prueba.
  const catGuardada = JSON.stringify(catH.datos);
  catH.datos = [['Nombre', 'Orden', 'Dentro de'], ['Termofusión', '1', 'CONEXIONES SANITARIAS PARA AGUA'], ['Flexibles', '2', 'CONEXIONES SANITARIAS PARA AGUA'],
    ['Válvulas y canillas', '3', 'CONEXIONES SANITARIAS PARA AGUA'], ['Artículos varios', '4', 'CONEXIONES SANITARIAS PARA AGUA'], ['', '5', 'CALEFACCIÓN ']];
  editar('Productos', fila('Productos', 'P001'), colCatP, 'Termofusion');
  const arbolViejo = JSON.stringify(respuesta(doGet({ parameter: { accion: 'catalogo' } })).arbol[0]);
  chequear('formato viejo: antes de migrar, el sitio igual arma el árbol', arbolViejo === '{"nombre":"CONEXIONES SANITARIAS PARA AGUA","hijas":["Termofusión"]}', arbolViejo);
  configurarPlanilla();
  chequear('configurarPlanilla pasa Categorías a dos columnas, en el mismo orden, sin perder CALEFACCIÓN',
    JSON.stringify(catH.datos) === JSON.stringify([['Categoría', 'Subcategoría'], ['CONEXIONES SANITARIAS PARA AGUA', 'Termofusión'], ['CONEXIONES SANITARIAS PARA AGUA', 'Flexibles'],
      ['CONEXIONES SANITARIAS PARA AGUA', 'Válvulas y canillas'], ['CONEXIONES SANITARIAS PARA AGUA', 'Artículos varios'], ['CALEFACCIÓN', '']]) && /dos columnas/.test(libro.ultimoToast),
    JSON.stringify(catH.datos) + ' ' + libro.ultimoToast);
  const regla = (hojas.get('Productos').validaciones || {})[colCatP] || {};
  chequear('Productos: la columna Categoría tiene un desplegable con las subcategorías (y las grandes sin subcategorías)',
    JSON.stringify((regla.requireValueInList || [])[0]) === '["Termofusión","Flexibles","Válvulas y canillas","Artículos varios","CALEFACCIÓN"]' && regla.setAllowInvalid && regla.setAllowInvalid[0] === true,
    JSON.stringify(regla));
  chequear('Categorías: la columna Categoría ofrece las grandes ya escritas', !!((catH.validaciones || {})[1] || {}).requireValueInRange);
  const catMigrado = respuesta(doGet({ parameter: { accion: 'catalogo' } }));
  chequear('después de migrar: mismo árbol, y "Termofusion" (sin tilde) en Productos cuenta como "Termofusión"',
    JSON.stringify(catMigrado.arbol[0]) === arbolViejo && catMigrado.productos.find(p => p.codigo === 'P001').categoria === 'Termofusión', JSON.stringify(catMigrado.arbol[0]));
  catH.datos.push(['Calefacción', 'Radiadores']);
  editar('Categorías', catH.datos.length, 2, 'Radiadores');
  chequear('al escribir una subcategoría nueva, el desplegable de Productos la suma enseguida',
    ((hojas.get('Productos').validaciones[colCatP].requireValueInList || [])[0] || []).includes('Radiadores'), JSON.stringify(hojas.get('Productos').validaciones[colCatP]));
  catH.datos = JSON.parse(catGuardada);
  editar('Productos', fila('Productos', 'P001'), colCatP, 'Categoría A');

  // Características con dos puntos de más ("Medida: : 1/2"", como quedaba al guardar "Medida:" en el formulario)
  const colCar1 = columnaProductos('Característica 1');
  editar('Productos', fila('Productos', 'P007'), colCar1, 'Medida: : 1/2"');
  const p007 = respuesta(doGet({ parameter: { accion: 'catalogo' } })).productos.find(p => p.codigo === 'P007');
  chequear('"Medida: : 1/2"" se lee como Medida = 1/2" (sin los dos puntos sobrantes)',
    p007.opciones[0].nombre === 'Medida' && p007.opciones[0].valor === '1/2"' && /\(1\/2" · PPR\)$/.test(p007.nombre), JSON.stringify(p007.opciones) + ' ' + p007.nombre);
  editar('Productos', fila('Productos', 'P007'), colCar1, 'Medida: 1/2"');

  // "TUBO PN20" con la medida "20": el nombre igual tiene que decir la medida (antes se omitía porque "PN20" contiene "20").
  const colGrupo = columnaProductos('Grupo'), grupoP007 = hojas.get('Productos').datos[fila('Productos', 'P007') - 1][colGrupo - 1];
  editar('Productos', fila('Productos', 'P007'), colGrupo, 'Tubo PN20');
  editar('Productos', fila('Productos', 'P007'), colCar1, 'Medida: 20');
  const tubo = respuesta(doGet({ parameter: { accion: 'catalogo' } })).productos.find(p => p.codigo === 'P007');
  chequear('con Grupo "Tubo PN20" y medida 20, el nombre dice "(20 · PPR)" (el pedido sabe qué medida es)', tubo.nombre === 'Tubo PN20 (20 · PPR)', tubo.nombre);
  editar('Productos', fila('Productos', 'P007'), colGrupo, grupoP007);
  editar('Productos', fila('Productos', 'P007'), colCar1, 'Medida: 1/2"');
  chequear('financiación: solo opciones activas (3 y 6)', JSON.stringify(cat.financiacion.map(o => o.cuotas)) === '[3,6]', JSON.stringify(cat.financiacion));
  chequear('cuotas por producto vienen de la hoja calculada', cat.productos[0].cuotas.length === 2 && cat.productos[0].cuotas[0].valor === 8333.33, JSON.stringify(cat.productos[0].cuotas));
  chequear('negocio: WhatsApp solo con números', cat.negocio.whatsapp === '5491169484851');
  chequear('no sale descontar_stock_al_confirmar', !('descontar_stock_al_confirmar' in cat.negocio));
  const p7 = cat.productos.find(p => p.codigo === 'P007');
  chequear('productos con opciones: traen Grupo y sus características', p7 && p7.grupo === 'Producto de ejemplo con opciones' && JSON.stringify(p7.opciones) === '[{"nombre":"Medida","valor":"1/2\\""},{"nombre":"Material","valor":"PPR"}]', JSON.stringify(p7));
  chequear('con Grupo y sin Nombre, el nombre se arma solo: Grupo (1/2" · PPR)', p7 && p7.nombre === 'Producto de ejemplo con opciones (1/2" · PPR)', p7 && p7.nombre);
  chequear('cada opción mantiene su precio y su stock (1" sin stock)', cat.productos.find(p => p.codigo === 'P010').estado === 'sin_stock' && cat.productos.find(p => p.codigo === 'P008').precio === 4200);
  // Caso real (21/10): características cargadas sin "Nombre:" y el mismo Nombre en todas las filas.
  const prodH = hojas.get('Productos');
  const tp = prodH.datos[0];
  const filaDe = o => tp.map(t => (t in o ? o[t] : ''));
  prodH.datos.push(
    filaDe({ 'Código': 'Q1', 'Nombre': 'Valvulas de drenaje', 'Categoría': 'Categoría A', 'Precio contado': 25000, 'Activo': 'sí', 'Grupo': 'Valvulas de drenaje', 'Característica 1': 'grande', 'Característica 2': 'gris', 'Característica 3': 'para llevar' }),
    filaDe({ 'Código': 'Q2', 'Nombre': 'Valvulas de drenaje', 'Categoría': 'Categoría A', 'Precio contado': 30000, 'Activo': 'sí', 'Grupo': 'Valvulas de drenaje', 'Característica 1': 'mediano', 'Característica 2': 'Color: blanco', 'Característica 3': 'para retirar' }));
  onEdit({ source: libro, value: 'x', range: prodH.getRange(2, 1) });
  const catQ = respuesta(doGet({ parameter: { accion: 'catalogo' } }));
  const q1 = catQ.productos.find(p => p.codigo === 'Q1');
  const q2 = catQ.productos.find(p => p.codigo === 'Q2');
  chequear('sin "Nombre:", cada columna es una característica distinta (Opción 1 / Color / Opción 3)',
    JSON.stringify(q1.opciones.map(o => o.nombre)) === '["Opción 1","Color","Opción 3"]' && JSON.stringify(q2.opciones.map(o => o.nombre)) === '["Opción 1","Color","Opción 3"]',
    JSON.stringify([q1.opciones, q2.opciones]));
  chequear('"Color" escrito en una sola fila vale para todo el grupo', q1.opciones[1].nombre === 'Color' && q1.opciones[1].valor === 'gris');
  chequear('con el mismo Nombre en todas las filas, el nombre suma la opción elegida', q1.nombre === 'Valvulas de drenaje (grande · gris · para llevar)' && q2.nombre === 'Valvulas de drenaje (mediano · blanco · para retirar)', q1.nombre + ' | ' + q2.nombre);
  prodH.datos.splice(-2, 2);
  onEdit({ source: libro, value: 'x', range: prodH.getRange(2, 1) });

  chequear('las 4 secciones de "Páginas" salen en orden',
    JSON.stringify(cat.paginas.map(p => p.clave)) === '["quienes-somos","envios-y-pagos","preguntas-frecuentes","contacto"]', JSON.stringify(cat.paginas));

  // Páginas: inactiva, sin texto, y nombre corto escrito "a mano" con mayúsculas y tildes
  const pag = hojas.get('Páginas');
  pag.poner(2, 6, 'no');
  pag.poner(4, 4, '');
  pag.datos.push(['Quiénes Somos 2', '', 'Otra', 'Texto', 9, 'sí']);
  onEdit({ source: libro, value: 'no', range: pag.getRange(2, 6) });
  const pags = respuesta(doGet({ parameter: { accion: 'catalogo' } })).paginas;
  chequear('Páginas: Activa = no o texto vacío → no aparece; el nombre corto se limpia (quienes-somos-2)',

  const escP004 = hojas.get('Escalas').datos.filter(f => f[0] === 'P004').length;
  const grupoEditado = Object.assign({}, formularioProducto('P007'), { escalasModificadas: false });
  grupoEditado.caracteristicas = ['Medida', 'Material'];
  grupoEditado.variantes = grupoEditado.variantes.filter(v => v.codigo !== 'P010').map(v => (v.codigo === 'P008' ? Object.assign(v, { precio: 4500 }) : v));
  grupoEditado.variantes.push({ codigo: 'P007-5', valores: ['1"', 'PP', ''], precio: '5000', stock: '3' });
  rg = formularioGuardar(grupoEditado);
  chequear('formulario: editar un grupo cambia precios, agrega opciones y desactiva las que se sacaron',
    rg.ok && filaProd('P008')['Precio contado'] === 4500 && filaProd('P010')['Activo'] === 'no' && filaProd('P007-5')['Grupo'] === 'Producto de ejemplo con opciones' &&
    filaProd('P007-5')['Característica 1'] === 'Medida: 1"' && filaProd('P007-5')['Característica 2'] === 'Material: PP' && filaProd('P007-5')['Nombre'] === '', JSON.stringify(rg));
  chequear('formulario: si no se tocan los descuentos, no se pisan los de la planilla', hojas.get('Escalas').datos.filter(f => f[0] === 'P004').length === escP004);
  const fp7 = formularioProducto('P007');
  rg = formularioGuardar(Object.assign({}, fp7, { escalasModificadas: false, caracteristicas: ['Medida:', 'Material :'], variantes: fp7.variantes.filter(v => v.activo) }));
  chequear('formulario: si el nombre de la característica trae ":" ("Medida:"), se guarda "Medida: 3/4"" y no "Medida:: 3/4""',
    rg.ok && filaProd('P008')['Característica 1'] === 'Medida: 3/4"' && filaProd('P008')['Característica 2'] === 'Material: PPR' && filaProd('P010')['Activo'] === 'no',
    JSON.stringify([rg, filaProd('P008')['Característica 1'], filaProd('P008')['Característica 2']]));
  const n1b = formularioProducto('N1');
  chequear('formulario: al volver a abrir un producto, trae su descuento como 5 (%)', n1b.escalas.length === 1 && n1b.escalas[0].descuento === 5 && n1b.escalas[0].desde === 6, JSON.stringify(n1b.escalas));

  // 12. El formulario de verdad (la barra lateral), conectado a esta planilla simulada
  await probarFormulario();

  const resumen = document.createElement('h2');
  resumen.className = fallas ? 'mal' : 'ok';
  resumen.textContent = fallas ? `${fallas} prueba(s) fallaron` : 'Todas las pruebas pasaron';
  document.body.insertBefore(resumen, lista);
}
// Abre la barra lateral (HTML_FORMULARIO_) en un marco, con un google.script.run simulado que llama
// a las funciones reales del script contra la planilla simulada, y la usa como lo haría una persona.
async function probarFormulario() {
  const puente = '<script>window.google = { script: { run: (function crear(ok, mal) {' +
    'var r = { withSuccessHandler: function (f) { return crear(f, mal); }, withFailureHandler: function (f) { return crear(ok, f); } };' +
    '["formularioDatos", "formularioProducto", "formularioGuardar"].forEach(function (n) { r[n] = function () { var a = JSON.parse(JSON.stringify([].slice.call(arguments)));' +
    'setTimeout(function () { try { var res = parent[n].apply(null, a); if (ok) ok(JSON.parse(JSON.stringify(res))); } catch (e) { if (mal) mal(e); } }, 20); }; });' +
    'return r; })() } };<' + '/script>';
  const marco = document.createElement('iframe');
  marco.style.cssText = 'width:300px;height:700px;border:1px solid #ccc';
  marco.title = 'Barra lateral';
  document.body.appendChild(marco);
  marco.srcdoc = HTML_FORMULARIO_.replace('<head>', '<head>' + puente);
  await new Promise(r => marco.addEventListener('load', r, { once: true }));
  const d = marco.contentDocument, w = marco.contentWindow, $ = id => d.getElementById(id);
  const esperaF = ms => new Promise(r => setTimeout(r, ms));
  const hasta = async (c, ms = 3000) => { for (let i = 0; i < ms / 50 && !c(); i++) await esperaF(50); };
  const fila = c => { const p = hojas.get('Productos'); const t = p.datos[0]; const f = p.datos.find(x => x[t.indexOf('Código')] === c); return f && Object.fromEntries(t.map((k, i) => [k, f[i]])); };
  const escribir = (el, v) => { el.value = v; el.dispatchEvent(new w.Event('input')); };

  await hasta(() => /productos cargados/.test($('cargando').textContent));
  chequear('barra lateral: carga la lista de productos y sugiere un código', /productos cargados/.test($('cargando').textContent) && /^P\d{3}$/.test($('codigo').value), $('codigo').value);

  // Producto simple
  $('guardar').click();
  await hasta(() => !$('mensaje').classList.contains('oculto'));
  chequear('barra lateral: guardar vacío explica qué falta', /Falta el nombre/.test($('mensaje').textContent) && /Falta la categoría/.test($('mensaje').textContent), $('mensaje').textContent);
  escribir($('nombre'), 'Llave de paso');
  $('categoria').value = '__otra__'; $('categoria').dispatchEvent(new w.Event('change'));
  chequear('barra lateral: "Otra categoría…" muestra el campo para escribirla y elegir dentro de cuál va', !$('nuevaCategoria').classList.contains('oculto') && $('categoriaPadre').options.length > 1);
  chequear('barra lateral: las subcategorías aparecen debajo de su grande ("— Subcategoría A1")',
    [...$('categoria').options].map(o => o.textContent).join('|').includes('Categoría A|— Subcategoría A1'), [...$('categoria').options].map(o => o.textContent).join('|'));
  escribir($('categoriaNueva'), 'Llaves');
  $('categoriaPadre').value = 'Categoría B';
  escribir($('precio'), '8.900'); escribir($('stock'), '4');
  const codigoSimple = $('codigo').value;
  $('guardar').click();
  await hasta(() => /Guardado/.test($('mensaje').textContent));
  chequear('barra lateral: guarda el producto simple en la planilla', /Guardado: Llave de paso/.test($('mensaje').textContent) && fila(codigoSimple) && fila(codigoSimple)['Precio contado'] === 8900 && fila(codigoSimple)['Categoría'] === 'Llaves', $('mensaje').textContent);
  const filasCat = hojas.get('Categorías').datos;
  const iLlaves = filasCat.findIndex(f => f[1] === 'Llaves');
  chequear('barra lateral: la categoría nueva queda como subcategoría de "Categoría B", en el lugar de la fila que estaba sola',
    iLlaves > 0 && filasCat[iLlaves][0] === 'Categoría B' && filasCat[iLlaves - 1][0] !== 'Categoría B' && !filasCat.some(f => f[0] === 'Categoría B' && !f[1]), JSON.stringify(filasCat));
  const arbolB = respuesta(doGet({ parameter: { accion: 'catalogo' } })).arbol.find(n => n.nombre === 'Categoría B');
  chequear('barra lateral: el sitio recibe "Llaves" dentro de "Categoría B"', arbolB && arbolB.hijas.includes('Llaves'), JSON.stringify(arbolB));
  await hasta(() => $('nombre').value === '');
  chequear('barra lateral: después de guardar queda lista para cargar otro, con el código siguiente', $('nombre').value === '' && $('codigo').value !== codigoSimple && /^P\d{3}$/.test($('codigo').value), $('codigo').value);

  // Producto con opciones
  escribir($('nombre'), 'Codo');
  $('categoria').value = 'Categoría A';
  $('conOpciones').click();
  chequear('barra lateral: "Tiene opciones" cambia precio/stock por la sección de opciones', $('simple').classList.contains('oculto') && !$('opciones').classList.contains('oculto'));
  const nombres = d.querySelectorAll('.carNombre'), valores = d.querySelectorAll('.carValores');
  escribir(nombres[0], 'Medida'); escribir(valores[0], '20 mm, 25 mm, 32 mm');
  escribir(nombres[1], 'Ángulo'); escribir(valores[1], '45°, 90°');
  escribir($('codigoBase'), 'COD'); escribir($('precioBase'), '1500');
  $('armar').click();
  const tarjetas = () => d.querySelectorAll('#variantes .tarjeta');
  chequear('barra lateral: "Armar combinaciones" arma 3 × 2 = 6 opciones con código y precio base', tarjetas().length === 6 && tarjetas()[0].querySelector('.vCodigo').value === 'COD-1' && tarjetas()[0].querySelector('.vPrecio').value === '1500' && /20 mm · 45°/.test(tarjetas()[0].textContent), tarjetas().length);
  escribir(tarjetas()[0].querySelector('.vPrecio'), '1700');
  tarjetas()[5].querySelector('.quitar').click();
  escribir(valores[0], '20 mm, 25 mm, 32 mm, 40 mm');
  $('armar').click();
  chequear('barra lateral: al rearmar, conserva lo editado y suma lo nuevo (8 combinaciones)', tarjetas().length === 8 && tarjetas()[0].querySelector('.vPrecio').value === '1700', tarjetas().length);
  for (const t of [...tarjetas()].slice(6)) t.querySelector('.quitar').click();
  $('agregarEscala').click();
  const esc = d.querySelector('#escalas .tarjeta');
  esc.querySelector('.ePara').value = 'mayoristas';
  escribir(esc.querySelector('.eDesde'), '10'); escribir(esc.querySelector('.eDesc'), '15');
  $('guardar').click();
  await hasta(() => /Guardado: Codo/.test($('mensaje').textContent));
  const codos = hojas.get('Productos').datos.filter(f => f[hojas.get('Productos').datos[0].indexOf('Grupo')] === 'Codo');
  chequear('barra lateral: guarda 6 filas con el mismo Grupo, sus características y precios', /6 opciones/.test($('mensaje').textContent) && codos.length === 6 && fila('COD-1')['Precio contado'] === 1700 && fila('COD-1')['Característica 2'] === 'Ángulo: 45°', $('mensaje').textContent);
  chequear('barra lateral: el descuento mayorista queda para las 6 opciones', hojas.get('Escalas').datos.filter(f => /^COD-/.test(f[0]) && f[1] === 'mayoristas' && f[3] === 0.15).length === 6);
  const catCodo = respuesta(doGet({ parameter: { accion: 'catalogo' } })).productos.filter(p => p.grupo === 'Codo');
  chequear('barra lateral: el sitio recibe el Codo con sus 6 opciones', catCodo.length === 6 && catCodo[0].nombre === 'Codo (20 mm · 45°)', catCodo[0] && catCodo[0].nombre);

  // Editar
  $('elegir').value = 'COD-1'; $('elegir').dispatchEvent(new w.Event('change'));
  await hasta(() => $('nombre').value === 'Codo');
  chequear('barra lateral: elegir un producto carga todos sus datos para editar', $('nombre').value === 'Codo' && tarjetas().length === 6 && d.querySelectorAll('#escalas .tarjeta').length === 1 && valores[1].value === '45°, 90°');
  escribir(tarjetas()[1].querySelector('.vStock'), '9');
  $('guardar').click();
  await hasta(() => fila('COD-2')['Stock'] === 9);
  chequear('barra lateral: guardar una edición actualiza la fila (no duplica)', fila('COD-2')['Stock'] === 9 && hojas.get('Productos').datos.filter(f => f[0] === 'COD-2').length === 1);
  marco.dataset.listo = '1';
}

correr().catch(err => { chequear('error inesperado', false, err.stack); });
</script>
